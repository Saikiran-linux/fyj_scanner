<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resume → Job Matches</title>
<style>
  :root { --bg:#0b0f1a; --panel:#141a2b; --panel2:#1b2236; --line:#27304a; --text:#e7ecf5; --muted:#8b97b3; --accent:#6ea8fe; --good:#3ddc97; --warn:#ffcc66; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:28px 20px 8px; text-align:center; }
  header h1 { margin:0 0 4px; font-size:24px; }
  header p { margin:0; color:var(--muted); }
  main { max-width:860px; margin:0 auto; padding:20px; }
  .drop { border:2px dashed var(--line); border-radius:14px; background:var(--panel); padding:34px 20px; text-align:center; transition:.15s; cursor:pointer; }
  .drop.drag { border-color:var(--accent); background:var(--panel2); }
  .drop strong { color:var(--accent); }
  .drop small { color:var(--muted); display:block; margin-top:6px; }
  textarea { width:100%; margin-top:14px; min-height:96px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:12px; font:13px/1.45 ui-monospace,Menlo,Consolas,monospace; resize:vertical; }
  .row { display:flex; gap:12px; align-items:center; margin-top:14px; flex-wrap:wrap; }
  button { background:var(--accent); color:#06122b; border:0; border-radius:10px; padding:11px 20px; font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .file { color:var(--muted); font-size:13px; }
  .status { margin-top:16px; color:var(--muted); min-height:20px; }
  .status.err { color:#ff8a8a; }
  .results { margin-top:18px; display:flex; flex-direction:column; gap:10px; }
  .card { display:flex; gap:14px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; align-items:flex-start; }
  .fit { flex:0 0 56px; text-align:center; }
  .fit .n { font-size:22px; font-weight:700; line-height:1; }
  .fit .l { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .meta { flex:1; min-width:0; }
  .meta h3 { margin:0 0 3px; font-size:16px; }
  .meta h3 a { color:var(--text); text-decoration:none; }
  .meta h3 a:hover { color:var(--accent); }
  .sub { color:var(--muted); font-size:13px; }
  .why { margin-top:6px; font-size:13px; color:#c6d0e6; }
  .tags { margin-top:7px; display:flex; gap:6px; flex-wrap:wrap; }
  .tag { font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 9px; }
  .apply { flex:0 0 auto; align-self:center; }
  .apply a { color:var(--accent); text-decoration:none; font-size:13px; font-weight:600; white-space:nowrap; }
  .bar { height:4px; border-radius:2px; background:var(--line); margin-top:6px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--good); }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:24px; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; vertical-align:-2px; margin-right:7px; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>Resume → Job Matches</h1>
  <p>Upload your résumé (PDF) and get the top live job matches, reranked by fit.</p>
</header>
<main>
  <div id="drop" class="drop">
    <div><strong>Drop a PDF résumé here</strong> or click to choose</div>
    <small id="filename">PDF parsed in your browser — only the extracted text is sent.</small>
    <input id="file" type="file" accept="application/pdf,.pdf,.txt" hidden />
  </div>

  <textarea id="paste" placeholder="…or paste your résumé text here"></textarea>

  <div class="row">
    <button id="go" disabled>Find matches</button>
  </div>

  <div id="status" class="status"></div>
  <div id="results" class="results"></div>
</main>
<footer>Two-stage matcher · cosine retrieve → gpt-4o-mini rerank · fyj_scanner</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs" type="module"></script>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';

const $ = (id) => document.getElementById(id);
const drop = $('drop'), fileInput = $('file'), paste = $('paste'), go = $('go'), status = $('status'), results = $('results'), filename = $('filename');
let resumeText = '';

function setStatus(msg, err = false) { status.className = 'status' + (err ? ' err' : ''); status.innerHTML = msg; }
function refresh() { resumeText = (resumeText || paste.value).trim(); go.disabled = resumeText.trim().length < 30; }

async function extractPdf(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    text += content.items.map((i) => i.str).join(' ') + '\n';
  }
  return text;
}

async function handleFile(file) {
  if (!file) return;
  filename.textContent = file.name;
  setStatus('<span class="spinner"></span>Reading résumé…');
  try {
    resumeText = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')
      ? await extractPdf(file)
      : await file.text();
    paste.value = resumeText.slice(0, 4000) + (resumeText.length > 4000 ? '\n…' : '');
    setStatus(`Loaded ${resumeText.length.toLocaleString()} characters. Click “Find matches”.`);
  } catch (e) {
    setStatus('Could not read that file: ' + e.message + '. Try pasting the text instead.', true);
  }
  refresh();
}

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('drag'); }));
['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', (e) => handleFile(e.dataTransfer.files[0]));
paste.addEventListener('input', () => { resumeText = ''; refresh(); });

go.addEventListener('click', async () => {
  const text = (resumeText || paste.value).trim();
  if (text.length < 30) return;
  go.disabled = true;
  results.innerHTML = '';
  setStatus('<span class="spinner"></span>Embedding résumé, retrieving and reranking jobs… (~10s)');
  try {
    const res = await fetch('/api/match', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resumeText: text }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    render(data);
  } catch (e) {
    setStatus('Error: ' + e.message, true);
  } finally {
    go.disabled = false;
    refresh();
  }
});

function render(data) {
  const tag = data.reranked ? 'reranked by gpt-4o-mini' : 'cosine only';
  setStatus(`Matched as <strong>${escapeHtml(data.title || 'your profile')}</strong> — top ${data.matches.length} of ${data.retrieved} candidates (${tag}, ${(data.tookMs / 1000).toFixed(1)}s).`);
  results.innerHTML = data.matches.map((m, i) => {
    const fit = m.fit != null ? m.fit : '—';
    const loc = [m.location, m.remote && m.remote !== m.location ? m.remote : null].filter(Boolean).join(' · ');
    const tags = [m.comp, m.posted ? 'posted ' + m.posted : null].filter(Boolean);
    return `<div class="card">
      <div class="fit">
        <div class="n">${fit}</div><div class="l">fit</div>
        <div class="bar"><i style="width:${m.fit != null ? m.fit : Math.round((m.cosine || 0) * 100)}%"></i></div>
      </div>
      <div class="meta">
        <h3>${i + 1}. ${m.url ? `<a href="${escapeAttr(m.url)}" target="_blank" rel="noopener">${escapeHtml(m.title || 'Untitled')}</a>` : escapeHtml(m.title || 'Untitled')}</h3>
        <div class="sub">${escapeHtml(m.company || '')}${loc ? ' · ' + escapeHtml(loc) : ''}</div>
        ${m.why ? `<div class="why">${escapeHtml(m.why)}</div>` : ''}
        ${tags.length ? `<div class="tags">${tags.map((t) => `<span class="tag">${escapeHtml(String(t))}</span>`).join('')}</div>` : ''}
      </div>
      ${m.url ? `<div class="apply"><a href="${escapeAttr(m.url)}" target="_blank" rel="noopener">Apply →</a></div>` : ''}
    </div>`;
  }).join('');
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function escapeAttr(s) { return escapeHtml(s); }
</script>
</body>
</html>
