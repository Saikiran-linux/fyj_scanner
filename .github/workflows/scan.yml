name: scan

on:
  schedule:
    # Every 6h at 00:17, 06:17, 12:17, 18:17 UTC. Offset off the top
    # of the hour because GitHub's schedule queue is heavily congested
    # at round times and silently drops fires — :17 lands in a quiet
    # slot and triggers reliably.
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch: {}

concurrency:
  # Never run two scans at once — they'd double-close jobs.
  group: scan
  cancel-in-progress: false

# Opt into Node 24 for action runtimes (actions/checkout etc).
# Node 20 is deprecated for actions effective June 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCAN_CONCURRENCY: '20'
        run: node src/scan.mjs

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-log-${{ github.run_id }}
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 14
