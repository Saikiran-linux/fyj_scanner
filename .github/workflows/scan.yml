name: scan

on:
  schedule:
    # Every 6h at 00:17, 06:17, 12:17, 18:17 UTC. Offset off the top
    # of the hour because GitHub's schedule queue is heavily congested
    # at round times and silently drops fires — :17 lands in a quiet
    # slot and triggers reliably.
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch: {}

concurrency:
  # Never run two scans at once — they'd double-close jobs.
  group: scan
  cancel-in-progress: false

# Opt into Node 24 for action runtimes (actions/checkout etc).
# Node 20 is deprecated for actions effective June 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  scan:
    strategy:
      # One shard failing must NOT cancel its siblings — each shard owns a
      # disjoint slice of companies, so a failure is isolated to that slice.
      fail-fast: false
      matrix:
        # Scan sharding (f-109). List 0..N-1 to fan the scan out across N
        # parallel jobs (N ≤ 60); SHARD_COUNT below derives from the matrix
        # length via strategy.job-total, so this list is the ONLY thing to
        # change. Default [0] = a single shard over the whole company set =
        # the unsharded scan. Safe to parallelize because close_unseen_jobs()
        # is per-company, so shards never touch each other's jobs.
        shard: [0]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Scheduled scans intentionally skip the gpt-4o-mini summary and
          # text-embedding-3-small passes — they cost real money per new
          # posting and we already have ~10k JDs summarised + embedded,
          # which is enough corpus for matching / NL-search experiments.
          # Re-enable by removing this flag (and adding OPENAI_API_KEY back
          # to the env) once the matching pipeline is proven and we want
          # fresh listings flowing into the embedding index again. Until
          # then, catch-up runs are manual: `npm run backfill-summaries`
          # and `npm run embed-backfill` locally with the key in env.
          SKIP_LLM_PASSES: '1'
          # Worker count. The prior SCAN_CONCURRENCY name was unused — the
          # code reads SCAN_WORKER_POOL — so the scan was silently running
          # at the default 25. Lowered to 10 because the choke point is the
          # Supabase pooler, not the ATS-side HTTP, and 25 concurrent
          # writers was pushing PostgREST into 504/statement-timeout
          # cascades. The rate limiter still caps per-provider concurrency
          # separately for the ATS HTTP calls.
          SCAN_WORKER_POOL: '10'
          # Cloudflare R2 — raw ATS response archive (Workstream A). All four
          # are required to enable archiving; if any is absent the scanner's
          # r2Enabled() gate returns false and the archive pass is a no-op, so
          # the scan still runs. These are repo secrets and must be mapped here
          # explicitly — GitHub does not auto-expose secrets as env vars.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # Sharding: each matrix job scans its slice. SHARD_COUNT derives from
          # the matrix length, so adding shards to the matrix above is the only
          # change needed. Default matrix [0] → SHARD_COUNT=1 (unsharded).
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: node src/scan.mjs

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per-shard name — matrix jobs can't share one artifact name (v4).
          name: scan-log-${{ github.run_id }}-shard${{ matrix.shard }}
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 14
