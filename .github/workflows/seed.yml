name: seed-companies

# Manual-trigger only. Runs the one-shot company loader.
# Use this on first setup, and any time you regenerate data/seeds.json.
# Safe to re-run: existing rows are upserted; enabled flag is preserved.

on:
  workflow_dispatch: {}

# Opt into Node 24 for action runtimes (actions/checkout etc).
# Node 20 is deprecated for actions effective June 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Upload seed companies to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node src/seed-companies.mjs
